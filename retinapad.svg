<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>

    <!-- Page Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f3f5"/>
    </linearGradient>

    <!-- Mint Retina Accent Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>

    <!-- Retina Iris Glow -->
    <linearGradient id="retinaGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base App Tile with rounded corners -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Notepad Paper Body -->
  <rect x="88" y="72" width="336" height="368" rx="20" fill="url(#pageGrad)" filter="url(#badgeShadow)"/>

  <!-- Notepad Header Bar (Linux Mint Green Accent) -->
  <path d="M 88 92 C 88 80.95 96.95 72 108 72 L 404 72 C 415.05 72 424 80.95 424 92 L 424 116 L 88 116 Z" fill="url(#mintGrad)"/>

  <!-- Spiral Binder Rings / Dots -->
  <circle cx="140" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="180" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="220" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="260" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="300" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="340" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
  <circle cx="380" cy="94" r="7" fill="#ffffff" opacity="0.9"/>

  <!-- Gutter divider (Line numbers margin) -->
  <line x1="160" y1="116" x2="160" y2="440" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4,4"/>

  <!-- Line Numbers (1, 2, 3, 4, 5, 6) -->
  <text x="135" y="162" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">1</text>
  <text x="135" y="210" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">2</text>
  <text x="135" y="258" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#2ecc71" text-anchor="middle">3</text>
  <text x="135" y="306" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">4</text>
  <text x="135" y="354" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">5</text>
  <text x="135" y="402" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="20" font-weight="bold" fill="#94a3b8" text-anchor="middle">6</text>

  <!-- Active Line Highlight (Line 3) -->
  <rect x="162" y="238" width="260" height="28" fill="#e8f8f0"/>

  <!-- Text Lines (crisp code/note lines) -->
  <!-- Line 1 -->
  <rect x="180" y="152" width="160" height="8" rx="4" fill="#64748b"/>
  <!-- Line 2 -->
  <rect x="180" y="200" width="210" height="8" rx="4" fill="#94a3b8"/>
  <!-- Line 3 (Active line with cursor) -->
  <rect x="180" y="248" width="120" height="8" rx="4" fill="#27ae60"/>
  <rect x="306" y="243" width="3" height="18" rx="1.5" fill="#27ae60"/> <!-- Blinking Cursor -->
  <!-- Line 4 -->
  <rect x="180" y="296" width="180" height="8" rx="4" fill="#94a3b8"/>
  <!-- Line 5 -->
  <rect x="180" y="344" width="140" height="8" rx="4" fill="#94a3b8"/>
  <!-- Line 6 -->
  <rect x="180" y="392" width="90" height="8" rx="4" fill="#94a3b8"/>

  <!-- Retina Vision Badge: High-DPI Eye / Lens on bottom right -->
  <g transform="translate(320, 310)" filter="url(#badgeShadow)">
    <!-- Badge Outer Glow Circle -->
    <circle cx="64" cy="64" r="64" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="64" cy="64" r="54" fill="#0f172a"/>

    <!-- Retina Eye Contour -->
    <path d="M 24 64 Q 64 26 104 64 Q 64 102 24 64 Z" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Iris -->
    <circle cx="64" cy="64" r="22" fill="url(#retinaGlow)" stroke="#7dd3fc" stroke-width="2"/>

    <!-- Pupil -->
    <circle cx="64" cy="64" r="10" fill="#090d16"/>

    <!-- Crisp Retina Light Reflections -->
    <circle cx="58" cy="58" r="4.5" fill="#ffffff"/>
    <circle cx="71" cy="70" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- HiDPI Scan/Resolution ticks -->
    <line x1="64" y1="18" x2="64" y2="26" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="64" y1="102" x2="64" y2="110" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="64" x2="26" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="102" y1="64" x2="110" y2="64" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
