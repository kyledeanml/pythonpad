<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Python Blue -->
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387eb8"/>
      <stop offset="100%" stop-color="#2c6393"/>
    </linearGradient>

    <!-- Python Yellow / Gold -->
    <linearGradient id="pyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe873"/>
      <stop offset="100%" stop-color="#ffd43b"/>
    </linearGradient>

    <!-- Page Paper Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <!-- Run Play Green -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Tile Base -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Document Sheet -->
  <rect x="80" y="68" width="352" height="376" rx="20" fill="url(#pageGrad)" filter="url(#badgeShadow)"/>

  <!-- Notepad Header Bar: Python Dual Colors -->
  <path d="M 80 88 C 80 77 89 68 100 68 L 256 68 L 256 104 L 80 104 Z" fill="url(#pyBlue)"/>
  <path d="M 256 68 L 412 68 C 423 68 432 77 432 88 L 432 104 L 256 104 Z" fill="url(#pyGold)"/>

  <!-- Spiral rings -->
  <circle cx="120" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="160" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="200" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="240" cy="86" r="6" fill="#ffffff" opacity="0.9"/>
  <circle cx="280" cy="86" r="6" fill="#1e293b" opacity="0.8"/>
  <circle cx="320" cy="86" r="6" fill="#1e293b" opacity="0.8"/>
  <circle cx="360" cy="86" r="6" fill="#1e293b" opacity="0.8"/>
  <circle cx="400" cy="86" r="6" fill="#1e293b" opacity="0.8"/>

  <!-- Line Numbers Gutter -->
  <line x1="148" y1="104" x2="148" y2="444" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Line Numbers 1, 2, 3, 4, 5 -->
  <text x="120" y="152" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">1</text>
  <text x="120" y="200" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">2</text>
  <text x="120" y="248" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#387eb8" text-anchor="middle">3</text>
  <text x="120" y="296" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">4</text>
  <text x="120" y="344" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">5</text>
  <text x="120" y="392" font-family="'DejaVu Sans Mono', monospace" font-size="18" font-weight="bold" fill="#94a3b8" text-anchor="middle">6</text>

  <!-- Active Line Highlight (Line 3) -->
  <rect x="150" y="228" width="280" height="28" fill="#e0f2fe"/>

  <!-- Python Code Lines -->
  <!-- Line 1: import sys, os -->
  <rect x="168" y="142" width="70" height="8" rx="4" fill="#a855f7"/>
  <rect x="246" y="142" width="80" height="8" rx="4" fill="#64748b"/>

  <!-- Line 2: def main(): -->
  <rect x="168" y="190" width="45" height="8" rx="4" fill="#387eb8"/>
  <rect x="220" y="190" width="75" height="8" rx="4" fill="#0ea5e9"/>

  <!-- Line 3: print("PythonPad") with cursor -->
  <rect x="190" y="238" width="55" height="8" rx="4" fill="#0284c7"/>
  <rect x="252" y="238" width="95" height="8" rx="4" fill="#eab308"/>
  <rect x="352" y="233" width="3" height="18" rx="1.5" fill="#0284c7"/>

  <!-- Line 4 -->
  <rect x="190" y="286" width="110" height="8" rx="4" fill="#94a3b8"/>
  <!-- Line 5 -->
  <rect x="168" y="334" width="60" height="8" rx="4" fill="#a855f7"/>
  <!-- Line 6 -->
  <rect x="190" y="382" width="90" height="8" rx="4" fill="#94a3b8"/>

  <!-- Interactive Python Badge -->
  <g transform="translate(310, 300)" filter="url(#badgeShadow)">
    <circle cx="70" cy="70" r="68" fill="#0f172a" stroke="#387eb8" stroke-width="4"/>
    <circle cx="70" cy="70" r="58" fill="#1e293b"/>

    <!-- Python Snakes Emblem -->
    <!-- Top Blue Snake -->
    <path d="M 68 34 C 48 34 38 42 38 54 L 38 64 L 68 64 L 68 70 L 26 70 C 14 70 6 78 6 92 C 6 106 14 114 26 114 L 36 114 L 36 100 C 36 88 46 80 58 80 L 88 80 C 98 80 106 72 106 62 L 106 50 C 106 38 96 34 84 34 Z" fill="url(#pyBlue)" transform="matrix(0.55, 0, 0, 0.55, 34, 30)"/>
    <circle cx="58" cy="56" r="3.5" fill="#ffffff"/>

    <!-- Bottom Yellow Snake -->
    <path d="M 72 106 C 92 106 102 98 102 86 L 102 76 L 72 76 L 72 70 L 114 70 C 126 70 134 62 134 48 C 134 34 126 26 114 26 L 104 26 L 104 40 C 104 52 94 60 82 60 L 52 60 C 42 60 34 68 34 78 L 34 90 C 34 102 44 106 56 106 Z" fill="url(#pyGold)" transform="matrix(0.55, 0, 0, 0.55, 34, 30)"/>
    <circle cx="82" cy="84" r="3.5" fill="#1e293b"/>

    <!-- Interactive >>> Prompt badge -->
    <rect x="22" y="94" width="46" height="20" rx="6" fill="#0284c7"/>
    <text x="45" y="108" font-family="'DejaVu Sans Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">&gt;&gt;&gt;</text>

    <!-- Run Play Triangle -->
    <polygon points="98,96 98,114 114,105" fill="url(#playGrad)"/>
  </g>
</svg>
